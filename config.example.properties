# Configuration file for the Weather Station application.

# Add your WeatherAPI key here to enable weather data fetching

# Free key from https://www.weatherapi.com/signup.aspx
# (you can also set the WEATHER_API_KEY environment variable instead)
weatherapi.key=

# Where the comments server is running. Leave as localhost if you start it on the same PC,
# or put the server machine's LAN IP here to share comments with friends on the same network.
comments.host=localhost
comments.port=5555
